name: Download and Release

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: '要下载的 ROM 链接'
        required: true
        default: 'https://cdn.evolution-x.org/raphael/17/EvolutionX-17.0-20260812-raphael-12.1-Official.zip/download'
      release_tag:
        description: 'Release 标签名'
        required: true
        default: 'v17.0-20260812-raphael'
      release_name:
        description: 'Release 名称'
        required: true
        default: 'EvolutionX 17.0 - Raphael - 20260812'

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Download ROM file via headless browser
        id: download
        run: |
          URL="${{ github.event.inputs.download_url }}"
          DOWNLOAD_DIR="$(pwd)/downloads"
          mkdir -p "$DOWNLOAD_DIR"

          echo "下载链接: $URL"
          echo "使用 Playwright 无头浏览器下载（绕过 Cloudflare 挑战）..."

          node -e "
          const { chromium } = require('playwright');
          const path = require('path');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const context = await browser.newContext({
              acceptDownloads: true,
              userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36'
            });
            const page = await context.newPage();

            try {
              console.log('正在导航到下载页面...');
              // 设置较长的超时时间以应对 Cloudflare 挑战
              const response = await page.goto('$URL', {
                waitUntil: 'networkidle',
                timeout: 120000
              });

              console.log('页面状态码:', response.status());
              console.log('最终 URL:', page.url());

              // 检查是否有下载按钮/链接，如果有就点击
              const downloadLink = await page.\$('a[href*=\"download\"], a[href*=\".zip\"], button:has-text(\"Download\")');
              if (downloadLink) {
                console.log('找到下载按钮/链接，点击中...');
                const [download] = await Promise.all([
                  page.waitForDownload({ timeout: 300000 }),
                  downloadLink.click()
                ]);
                const filePath = path.join('$DOWNLOAD_DIR', download.suggestedFilename());
                await download.saveAs(filePath);
                console.log('DOWNLOAD_FILE=' + download.suggestedFilename());
              } else {
                // 页面可能直接触发了下载
                console.log('未找到下载按钮，等待页面自动下载...');
                try {
                  const download = await page.waitForDownload({ timeout: 300000 });
                  const filePath = path.join('$DOWNLOAD_DIR', download.suggestedFilename());
                  await download.saveAs(filePath);
                  console.log('DOWNLOAD_FILE=' + download.suggestedFilename());
                } catch (dlErr) {
                  // 如果没有触发下载，可能页面就是最终的重定向目标
                  // 尝试从当前页面 URL 获取 cookies 然后用 curl 下载
                  console.log('未触发下载，尝试提取 cookies 后用 curl 下载...');
                  const cookies = await context.cookies();
                  const cookieStr = cookies.map(c => c.name + '=' + c.value).join('; ');
                  const fs = require('fs');
                  fs.writeFileSync('$DOWNLOAD_DIR/cookies.txt', cookieStr);
                  fs.writeFileSync('$DOWNLOAD_DIR/final_url.txt', page.url());
                  console.log('COOKIES_SAVED=true');
                  console.log('FINAL_URL=' + page.url());
                }
              }
            } catch (err) {
              console.error('Playwright 错误:', err.message);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          " 2>&1

          # 检查 Playwright 是否直接下载了文件
          DOWNLOADED_FILE=$(ls -t "$DOWNLOAD_DIR"/*.zip 2>/dev/null | head -1)

          if [ -z "$DOWNLOADED_FILE" ] && [ -f "$DOWNLOAD_DIR/cookies.txt" ]; then
            echo "Playwright 未直接下载文件，使用获取的 cookies 尝试 curl 下载..."
            COOKIES=$(cat "$DOWNLOAD_DIR/cookies.txt")
            FINAL_URL=$(cat "$DOWNLOAD_DIR/final_url.txt")
            FILENAME=$(echo "$FINAL_URL" | awk -F'/' '{print $NF}' | cut -d'?' -f1)
            if [[ "$FILENAME" != *.zip ]]; then
              FILENAME="EvolutionX-17.0-20260812-raphael-12.1-Official.zip"
            fi

            echo "目标文件: $FILENAME"
            echo "最终 URL: $FINAL_URL"

            curl -L -f -v -o "$DOWNLOAD_DIR/$FILENAME" \
              -b "$COOKIES" \
              -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36" \
              --connect-timeout 30 \
              --max-time 1800 \
              --retry 3 \
              --retry-delay 5 \
              "$FINAL_URL" || {
                echo "curl 下载失败，尝试直接用 Playwright 导航到最终 URL..."
                # 最终回退：直接用 wget
                wget -O "$DOWNLOAD_DIR/$FILENAME" \
                  --header="Cookie: $COOKIES" \
                  --header="User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36" \
                  "$FINAL_URL"
              }
            DOWNLOADED_FILE="$DOWNLOAD_DIR/$FILENAME"
          fi

          if [ -z "$DOWNLOADED_FILE" ] || [ ! -s "$DOWNLOADED_FILE" ]; then
            echo "错误：下载失败，未找到有效文件"
            ls -lhR "$DOWNLOAD_DIR"
            exit 1
          fi

          # 获取文件名
          BASENAME=$(basename "$DOWNLOADED_FILE")
          echo "ZIP_FILE=$DOWNLOADED_FILE" >> $GITHUB_ENV
          echo "FILE_NAME=$BASENAME" >> $GITHUB_ENV
          echo "下载成功: $BASENAME"
          ls -lh "$DOWNLOADED_FILE"

      - name: Get file info
        run: |
          FILE_SIZE=$(stat -c%s "${{ env.ZIP_FILE }}")
          FILE_SHA256=$(sha256sum "${{ env.ZIP_FILE }}" | awk '{print $1}')
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV
          echo "FILE_SHA256=$FILE_SHA256" >> $GITHUB_ENV
          echo "文件大小: $(( FILE_SIZE / 1024 / 1024 )) MB"
          echo "SHA256: $FILE_SHA256"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_name }}
          body: |
            ## EvolutionX ROM

            - **设备**: Raphael (Redmi K20 Pro / Mi 9T Pro)
            - **版本**: 17.0
            - **构建日期**: 20260812
            - **文件大小**: ${{ env.FILE_SIZE }} bytes
            - **SHA256**: `${{ env.FILE_SHA256 }}`
            - **下载源**: ${{ github.event.inputs.download_url }}
          draft: false
          prerelease: false
          files: |
            ${{ env.ZIP_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
