name: Download and Release

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: '要下载的 ROM 链接'
        required: true
        default: 'https://cdn.evolution-x.org/raphael/17/EvolutionX-17.0-20260812-raphael-12.1-Official.zip/download'
      release_tag:
        description: 'Release 标签名'
        required: true
        default: 'v17.0-20260812-raphael'
      release_name:
        description: 'Release 名称'
        required: true
        default: 'EvolutionX 17.0 - Raphael - 20260812'

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Download ROM file via headless browser
        id: download
        run: |
          URL="${{ github.event.inputs.download_url }}"
          DOWNLOAD_DIR="$(pwd)/downloads"
          mkdir -p "$DOWNLOAD_DIR"

          echo "下载链接: $URL"
          echo "使用 Playwright 无头浏览器下载（绕过 Cloudflare 挑战）..."

          node -e "
          const { chromium } = require('playwright');
          const path = require('path');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const context = await browser.newContext({
              acceptDownloads: true,
              userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36'
            });
            const page = await context.newPage();

            try {
              console.log('正在导航到下载页面...');

              // 先设置下载事件监听，再导航（因为 URL 可能直接触发下载）
              const downloadPromise = page.waitForEvent('download', { timeout: 300000 });

              try {
                await page.goto('$URL', {
                  waitUntil: 'commit',
                  timeout: 120000
                });
              } catch (navErr) {
                // 'Download is starting' 不是真正的错误，说明下载已触发
                if (navErr.message.includes('Download')) {
                  console.log('检测到下载已触发: ' + navErr.message);
                } else {
                  throw navErr;
                }
              }

              // 等待下载完成
              console.log('等待下载完成...');
              const download = await downloadPromise;
              const suggestedName = download.suggestedFilename();
              const fileName = suggestedName && suggestedName !== 'download'
                ? suggestedName
                : 'EvolutionX-17.0-20260812-raphael-12.1-Official.zip';
              const filePath = path.join('$DOWNLOAD_DIR', fileName);

              console.log('保存文件: ' + fileName);
              await download.saveAs(filePath);
              console.log('DOWNLOAD_FILE=' + fileName);
              console.log('下载完成!');

            } catch (err) {
              console.error('Playwright 错误:', err.message);
              // 如果 Playwright 失败，保存 cookies 供 curl 回退
              try {
                const cookies = await context.cookies();
                const cookieStr = cookies.map(c => c.name + '=' + c.value).join('; ');
                fs.writeFileSync('$DOWNLOAD_DIR/cookies.txt', cookieStr);
                fs.writeFileSync('$DOWNLOAD_DIR/final_url.txt', page.url());
                console.log('COOKIES_SAVED=true');
                console.log('FINAL_URL=' + page.url());
              } catch (e) {
                console.error('保存 cookies 失败:', e.message);
              }
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          " 2>&1

          # 检查 Playwright 是否直接下载了文件
          DOWNLOADED_FILE=$(ls -t "$DOWNLOAD_DIR"/*.zip 2>/dev/null | head -1)

          if [ -z "$DOWNLOADED_FILE" ] && [ -f "$DOWNLOAD_DIR/cookies.txt" ]; then
            echo "Playwright 未直接下载文件，使用获取的 cookies 尝试 curl 下载..."
            COOKIES=$(cat "$DOWNLOAD_DIR/cookies.txt")
            FINAL_URL=$(cat "$DOWNLOAD_DIR/final_url.txt")
            FILENAME=$(echo "$FINAL_URL" | awk -F'/' '{print $NF}' | cut -d'?' -f1)
            if [[ "$FILENAME" != *.zip ]]; then
              FILENAME="EvolutionX-17.0-20260812-raphael-12.1-Official.zip"
            fi

            echo "目标文件: $FILENAME"
            echo "最终 URL: $FINAL_URL"

            curl -L -f -v -o "$DOWNLOAD_DIR/$FILENAME" \
              -b "$COOKIES" \
              -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36" \
              --connect-timeout 30 \
              --max-time 1800 \
              --retry 3 \
              --retry-delay 5 \
              "$FINAL_URL" || {
                echo "curl 下载失败，尝试直接用 Playwright 导航到最终 URL..."
                # 最终回退：直接用 wget
                wget -O "$DOWNLOAD_DIR/$FILENAME" \
                  --header="Cookie: $COOKIES" \
                  --header="User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36" \
                  "$FINAL_URL"
              }
            DOWNLOADED_FILE="$DOWNLOAD_DIR/$FILENAME"
          fi

          if [ -z "$DOWNLOADED_FILE" ] || [ ! -s "$DOWNLOADED_FILE" ]; then
            echo "错误：下载失败，未找到有效文件"
            ls -lhR "$DOWNLOAD_DIR"
            exit 1
          fi

          # 获取文件名
          BASENAME=$(basename "$DOWNLOADED_FILE")
          echo "ZIP_FILE=$DOWNLOADED_FILE" >> $GITHUB_ENV
          echo "FILE_NAME=$BASENAME" >> $GITHUB_ENV
          echo "下载成功: $BASENAME"
          ls -lh "$DOWNLOADED_FILE"

      - name: Get file info
        run: |
          FILE_SIZE=$(stat -c%s "${{ env.ZIP_FILE }}")
          FILE_SHA256=$(sha256sum "${{ env.ZIP_FILE }}" | awk '{print $1}')
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV
          echo "FILE_SHA256=$FILE_SHA256" >> $GITHUB_ENV
          echo "文件大小: $(( FILE_SIZE / 1024 / 1024 )) MB"
          echo "SHA256: $FILE_SHA256"

      - name: Split file if exceeds 2GB
        id: split
        run: |
          FILE="${{ env.ZIP_FILE }}"
          FILE_SIZE=$(stat -c%s "$FILE")
          MAX_SIZE=2000000000  # 2GB in bytes (GitHub Release limit is 2147483648)

          if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "文件大小 $(($FILE_SIZE / 1024 / 1024))MB 超过 2GB 限制，正在分卷..."
            SPLIT_DIR="$(pwd)/split_parts"
            mkdir -p "$SPLIT_DIR"
            # 分卷为 1.9GB 的块，确保每块都在限制内
            split -b 1900m "$FILE" "$SPLIT_DIR/part_"
            # 为分卷文件添加 .zip 扩展名以便上传
            for f in "$SPLIT_DIR"/part_*; do
              mv "$f" "${f}.zip"
            done
            echo "分卷完成："
            ls -lh "$SPLIT_DIR"
            echo "SPLIT=true" >> $GITHUB_ENV
            echo "SPLIT_DIR=$SPLIT_DIR" >> $GITHUB_ENV
            echo "PART_COUNT=$(ls "$SPLIT_DIR"/*.zip | wc -l)" >> $GITHUB_ENV
          else
            echo "文件大小 $(($FILE_SIZE / 1024 / 1024))MB 未超过限制，无需分卷"
            echo "SPLIT=false" >> $GITHUB_ENV
          fi

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_name }}
          body: |
            ## EvolutionX ROM

            - **设备**: Raphael (Redmi K20 Pro / Mi 9T Pro)
            - **版本**: 17.0
            - **构建日期**: 20260812
            - **文件大小**: ${{ env.FILE_SIZE }} bytes (${{ env.FILE_NAME }})
            - **SHA256**: `${{ env.FILE_SHA256 }}`
            - **下载源**: ${{ github.event.inputs.download_url }}
            ${{ env.SPLIT == 'true' && '- **注意**: 文件超过 2GB，已分卷上传。下载所有分卷后合并：`cat part_*.zip > original.zip`' || '' }}
          draft: false
          prerelease: false
          files: |
            ${{ env.SPLIT == 'true' && format('{0}/*.zip', env.SPLIT_DIR) || env.ZIP_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
