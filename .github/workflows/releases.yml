name: Download and Release

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: '要下载的 ROM 链接'
        required: true
        default: 'https://cdn.evolution-x.org/raphael/17/EvolutionX-17.0-20260812-raphael-12.1-Official.zip/download'
      release_tag:
        description: 'Release 标签名'
        required: true
        default: 'v17.0-20260812-raphael'
      release_name:
        description: 'Release 名称'
        required: true
        default: 'EvolutionX 17.0 - Raphael - 20260812'

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ROM file (follow redirects)
        run: |
          URL="${{ github.event.inputs.download_url }}"
          echo "下载链接: $URL"

          # 从 URL 中提取文件名（去掉末尾的 /download 等路径）
          FILENAME=$(echo "$URL" | sed 's|/download$||' | awk -F'/' '{print $NF}')
          # 确保文件名以 .zip 结尾
          if [[ "$FILENAME" != *.zip ]]; then
            FILENAME="${FILENAME}.zip"
          fi
          echo "目标文件名: $FILENAME"

          # 模拟浏览器的 User-Agent，绕过 Cloudflare 反爬虫检测
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36"

          # 下载文件
          # -L 跟随重定向
          # -f HTTP 错误时返回非零退出码
          # -A 设置 User-Agent
          # --retry-all-errors 确保所有错误类型都重试
          echo "开始下载..."
          curl -L -f -v -o "$FILENAME" \
            -A "$UA" \
            --connect-timeout 30 \
            --max-time 1800 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "$URL"

          CURL_EXIT=$?
          if [ $CURL_EXIT -ne 0 ]; then
            echo "错误：curl 下载失败，退出码: $CURL_EXIT"
            echo "尝试不带 /download 后缀的 URL..."
            # 有些 CDN 的 /download 路径会触发 Cloudflare 挑战
            # 尝试直接下载文件 URL
            DIRECT_URL=$(echo "$URL" | sed 's|/download$||')
            if [ "$DIRECT_URL" != "$URL" ]; then
              echo "尝试直接链接: $DIRECT_URL"
              curl -L -f -v -o "$FILENAME" \
                -A "$UA" \
                --connect-timeout 30 \
                --max-time 1800 \
                --retry 3 \
                --retry-delay 5 \
                --retry-all-errors \
                "$DIRECT_URL"
              CURL_EXIT=$?
            fi
            if [ $CURL_EXIT -ne 0 ]; then
              echo "错误：所有下载方式均失败，退出码: $CURL_EXIT"
              exit 1
            fi
          fi

          # 验证文件存在且大小大于 0
          if [ ! -s "$FILENAME" ]; then
            echo "错误：下载的文件不存在或为空"
            ls -lh "$FILENAME" 2>/dev/null
            exit 1
          fi

          # 验证文件是否为有效的 zip 文件（检查 magic bytes）
          FILE_HEADER=$(xxd -l 4 -p "$FILENAME")
          echo "文件头: $FILE_HEADER"
          if [[ "$FILE_HEADER" != 504b0304* ]] && [[ "$FILE_HEADER" != 504b0506* ]]; then
            echo "警告：文件可能不是有效的 ZIP 文件（magic bytes 不匹配）"
            echo "文件内容前 500 字节："
            head -c 500 "$FILENAME"
            echo ""
            # 如果是 HTML 页面（Cloudflare 挑战页面），退出
            if file "$FILENAME" | grep -q "HTML"; then
              echo "错误：下载的是 HTML 页面而非 ZIP 文件，可能被 Cloudflare 拦截"
              exit 1
            fi
          fi

          echo "ZIP_FILE=$FILENAME" >> $GITHUB_ENV
          echo "下载成功！"
          ls -lh "$FILENAME"

      - name: Get file info
        run: |
          FILE_SIZE=$(stat -c%s "${{ env.ZIP_FILE }}")
          FILE_SHA256=$(sha256sum "${{ env.ZIP_FILE }}" | awk '{print $1}')
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV
          echo "FILE_SHA256=$FILE_SHA256" >> $GITHUB_ENV
          echo "文件大小: $(( FILE_SIZE / 1024 / 1024 )) MB"
          echo "SHA256: $FILE_SHA256"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_name }}
          body: |
            ## EvolutionX ROM

            - **设备**: Raphael (Redmi K20 Pro / Mi 9T Pro)
            - **版本**: 17.0
            - **构建日期**: 20260812
            - **文件大小**: ${{ env.FILE_SIZE }} bytes
            - **SHA256**: `${{ env.FILE_SHA256 }}`
            - **下载源**: ${{ github.event.inputs.download_url }}
          draft: false
          prerelease: false
          files: |
            ${{ env.ZIP_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
